# BILLING2.6 (Bloco Asaas 2.6): política de JWT explícita e versionada por
# Edge Function, em vez de depender apenas de uma flag de linha de comando
# no momento do deploy. As 6 funções chamadas pelo próprio app do UniFlow
# exigem sessão de usuário autenticado (verify_jwt = true, o padrão da
# plataforma) e validam workspace internamente. `billing-webhook` é a única
# exceção: é chamada pela própria Asaas (servidor a servidor, sem sessão de
# usuário do UniFlow), então a plataforma não pode exigir um JWT do
# Supabase Auth aqui -- a autenticidade é garantida em código, comparando o
# header `asaas-access-token` com o secret `ASAAS_WEBHOOK_TOKEN` (ver
# supabase/functions/billing-webhook/index.ts).
#
# A integração com o GitHub só deploya, no merge na main, as funções que têm
# entrada neste arquivo. Função nova entra aqui na mesma PR, senão só sobe
# por `supabase functions deploy` à mão.

[functions.billing-health]
verify_jwt = true

[functions.billing-create-customer]
verify_jwt = true

[functions.billing-create-subscription]
verify_jwt = true

[functions.billing-create-checkout]
verify_jwt = true

[functions.billing-get-subscription]
verify_jwt = true

[functions.billing-cancel-subscription]
verify_jwt = true

[functions.billing-sync]
verify_jwt = true

[functions.billing-webhook]
verify_jwt = false

# Google Agenda (épico #98). connect, confirm e disconnect exigem sessão. O callback é
# chamado pelo Google, sem JWT do Supabase: quem autentica é o state de uso
# único gravado pelo connect, mais o PKCE.
[functions.google-calendar-connect]
verify_jwt = true

[functions.google-calendar-oauth-callback]
verify_jwt = false

[functions.google-calendar-disconnect]
verify_jwt = true

# Ativa a conexão deixada pendente pelo callback, só para quem iniciou o fluxo.
[functions.google-calendar-confirm]
verify_jwt = true

# Consome a fila de exportação para o Google Agenda (#100). Chamada pelo
# pg_cron com o segredo de private.google_calendar_dispatch_secret.
[functions.google-calendar-export]
verify_jwt = false

# Escreve a Leitura do mês da Home com o Haiku (#122). Exige sessão: a
# função confere o usuário em /auth/v1/user e a cota diária por pessoa.
[functions.uni-insights]
verify_jwt = true

# Uni: interpretação da frase, chat, voz e atualizações. Exigem sessão.
[functions.uni-interpret]
verify_jwt = true

[functions.uni-chat-llm]
verify_jwt = true

[functions.uni-voice-realtime-session]
verify_jwt = true

[functions.uni-voice-transcribe]
verify_jwt = true

[functions.uni-voice-tts]
verify_jwt = true

[functions.generate-uni-premium-voice]
verify_jwt = true

[functions.billing-change-plan]
verify_jwt = true

[functions.billing-create-test-payment]
verify_jwt = true

# Web Push. decision e test exigem sessão. Os dois dispatch são chamados pelo
# pg_cron sem JWT do Supabase: quem autentica é o segredo conferido por RPC
# (verify_agenda_dispatch_secret e verify_uni_updates_dispatch_secret).
[functions.agenda-push-decision]
verify_jwt = true

[functions.push-send-test-notification]
verify_jwt = true

[functions.agenda-push-dispatch]
verify_jwt = false

[functions.uni-updates-push-dispatch]
verify_jwt = false
